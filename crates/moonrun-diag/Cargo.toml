[package]
name = "moonrun-diag"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "moonrun's guest diagnostics (source maps, stack rendering, demangling, memory sanitizer) for moonrun-js"

[lib]
crate-type = ["cdylib"]

[features]
# The upstream renderer must retain V8 locations supplied by our adapters.
default = ["v8"]
v8 = []
# Known upstream renderer feature names; this component selects v8 above.
wasmtime = []
wee8 = []

[dependencies]
os = { path = "../os" }
moonutil = { path = "../moonutil" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
